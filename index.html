<title>Week by Week</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: a household ledger. A strip of four bucket columns up top, ruled statement sheets below, one week at a time. */
:root{
  --bg:#EDF1EF; --sheet:#FAFCFB; --ink:#16201B; --muted:#56655E; --rule:#CFD8D3; --rule2:#E2E8E5;
  --bills:#1E6A49; --joint:#2D5B98; --pocket:#6A4AA6; --personal:#866427;
  --ok:#1E7A4F; --warn:#A0560B; --bad:#AE352A;
  --bills-t:rgba(30,106,73,.09); --joint-t:rgba(45,91,152,.09); --pocket-t:rgba(106,74,166,.09); --personal-t:rgba(134,100,39,.10);
  --ok-t:rgba(30,122,79,.10); --warn-t:rgba(160,86,11,.10); --bad-t:rgba(174,53,42,.09);
  --shield-bg:#16201B; --shield-fg:#F1F5F3; --shield-mut:#A9B8B1;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  --f-display:"Schibsted Grotesk","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --sheet:#171F1C; --ink:#E2EAE6; --muted:#98A69F; --rule:#2B3632; --rule2:#212B27;
  --bills:#5CC291; --joint:#80A9E6; --pocket:#B49AEB; --personal:#D8B26B;
  --ok:#5CC291; --warn:#E39A52; --bad:#EE7B6E;
  --bills-t:rgba(92,194,145,.13); --joint-t:rgba(128,169,230,.13); --pocket-t:rgba(180,154,235,.13); --personal-t:rgba(216,178,107,.13);
  --ok-t:rgba(92,194,145,.13); --warn-t:rgba(227,154,82,.14); --bad-t:rgba(238,123,110,.13);
  --shield-bg:#E2EAE6; --shield-fg:#111814; --shield-mut:#46544D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --sheet:#171F1C; --ink:#E2EAE6; --muted:#98A69F; --rule:#2B3632; --rule2:#212B27;
  --bills:#5CC291; --joint:#80A9E6; --pocket:#B49AEB; --personal:#D8B26B;
  --ok:#5CC291; --warn:#E39A52; --bad:#EE7B6E;
  --bills-t:rgba(92,194,145,.13); --joint-t:rgba(128,169,230,.13); --pocket-t:rgba(180,154,235,.13); --personal-t:rgba(216,178,107,.13);
  --ok-t:rgba(92,194,145,.13); --warn-t:rgba(227,154,82,.14); --bad-t:rgba(238,123,110,.13);
  --shield-bg:#E2EAE6; --shield-fg:#111814; --shield-mut:#46544D;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);margin:0}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px}
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--joint);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.09em;font-size:.72rem;color:var(--muted)}
.mut{color:var(--muted)}
p{margin:0}

.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;margin-bottom:14px}
.brand h1{font-size:clamp(1.7rem,4.4vw,2.4rem);font-weight:800;letter-spacing:-.02em}
.brand p{color:var(--muted);margin-top:2px}
.weekpill{font:600 .9rem var(--f-mono);border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:5px 12px;white-space:nowrap}

.stack{display:grid;gap:16px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.two{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:16px;min-width:0;display:grid;gap:12px;align-content:start}
.panel > *{min-width:0}
.panel > header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 14px}
.panel h2{font-size:1.25rem;font-weight:800}
.panel h3{font-size:1.05rem;font-weight:700}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:14px;color:var(--muted);font-size:.95rem;display:grid;gap:8px;justify-items:start}

.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:600;font-size:.93rem;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.strong{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 9px;font-size:.84rem}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{background:none;border:0;padding:0;color:var(--joint);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:4px;font:700 .7rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok);background:var(--ok-t)} .chip.warn{color:var(--warn);background:var(--warn-t)} .chip.bad{color:var(--bad);background:var(--bad-t)} .chip.idle{color:var(--muted)}
.acc{display:inline-block;font:700 .7rem var(--f-display);letter-spacing:.05em;text-transform:uppercase;border-radius:4px;padding:2px 6px;color:var(--c);background:var(--ct);white-space:nowrap}
.c-bills{--c:var(--bills);--ct:var(--bills-t)} .c-joint{--c:var(--joint);--ct:var(--joint-t)} .c-pocket{--c:var(--pocket);--ct:var(--pocket-t)} .c-personal{--c:var(--personal);--ct:var(--personal-t)} .c-card{--c:var(--bad);--ct:var(--bad-t)}

/* shield band */
.shield{background:var(--shield-bg);color:var(--shield-fg);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.shield .label{color:var(--shield-mut)}
.shield blockquote{margin:0;font:600 clamp(1.08rem,2.6vw,1.3rem)/1.42 var(--f-body);max-width:62ch}
.shield .row{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.shield .btn{background:transparent;color:var(--shield-fg);border-color:var(--shield-mut)}
.shield small{color:var(--shield-mut)}

/* buckets */

.income{font-size:.97rem}
.income b{font-family:var(--f-mono);font-weight:600}

.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:.9rem}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}

.meter{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.gauge{width:260px;max-width:100%;height:auto}
.meterinfo{display:grid;gap:6px;flex:1 1 220px;min-width:0;justify-items:start}
.meterinfo > b{font-size:1.5rem}
.advice{border-left:4px solid var(--ink);background:var(--rule2);border-radius:0 10px 10px 0;padding:10px 14px;display:grid;gap:4px}
.advice p{font-weight:600;max-width:70ch}
.sigs{display:grid}
.sig{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule2)}
.sig:last-child{border-bottom:0}
.sig .chip{justify-self:start;margin-top:2px}
.sig p{font-size:.9rem}

@media (max-width:520px){.sig{grid-template-columns:minmax(0,1fr)}}
.whogrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.whocard{border:1px solid var(--rule);border-top:4px solid var(--c);border-radius:10px;padding:10px 12px;background:var(--sheet);display:grid;gap:6px;align-content:start;min-width:0}
.whocard .label{color:var(--c)}
.whocard .chip{justify-self:start}
.whocard > b{font:600 1.35rem var(--f-mono);font-variant-numeric:tabular-nums}
.paper .whogrid{grid-template-columns:repeat(3,minmax(0,1fr))}
.who{display:inline-block;font:700 .72rem var(--f-display);letter-spacing:.05em;text-transform:uppercase;color:var(--c)}
/* report page 1: at a glance */

.gtiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.gtiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.paper .gtiles{grid-template-columns:repeat(4,minmax(0,1fr))}
.gt{border:1px solid var(--rule);border-radius:12px;padding:12px 14px;background:var(--sheet);display:grid;gap:4px;align-content:start;min-width:0}
.gt > b{font:600 1.5rem/1.15 var(--f-mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.gt small{color:var(--muted);font-size:.86rem}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.gbar{display:block;height:8px;border-radius:999px;background:var(--rule2);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--ok);border-radius:999px}

.gbar.wide{height:14px}

.util{display:grid;gap:6px}
.uhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 12px}
.uhead b{font-size:1.2rem}
.utrack{position:relative;height:18px;border-radius:999px;background:var(--rule2);overflow:hidden}
.util.compact .utrack{height:12px}
.utrack i{position:absolute;left:0;top:0;bottom:0;border-radius:999px}
.utrack .ughost{background:repeating-linear-gradient(135deg,var(--rule) 0 4px,var(--rule2) 4px 8px)}
.utrack s{position:absolute;top:0;bottom:0;width:2px;background:var(--sheet);opacity:.9}
.uscale{position:relative;height:14px;font:600 .7rem var(--f-mono);color:var(--muted)}
.uscale span{position:absolute;transform:translateX(-50%)}
.uscale span:first-child{transform:none}
.uscale span:last-child{transform:translateX(-100%)}
.cyc{padding:30px 6px 42px}
.cyctrack{position:relative;height:10px;border-radius:999px;background:var(--rule2)}
.cyctrack .seg{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--joint-t);border:1px solid var(--joint)}
.cm{position:absolute;top:-6px;transform:translateX(-50%);display:grid;justify-items:center;font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:26px}
.cm::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:3px;height:22px;border-radius:2px;background:var(--muted)}
.cm:first-of-type::before{left:0;transform:none}

.cm.duep::before{background:var(--bad)} .cm.duep b{color:var(--bad)}
.cm b{color:var(--ink);font-size:.8rem}
.cm.due::before{left:auto;right:0;transform:none;background:var(--bad)} .cm.due b{color:var(--bad)}
.cm.now{top:-30px;padding-top:0;padding-bottom:26px}
.cm.now::before{top:auto;bottom:0;background:var(--ink)}
.cm:first-of-type{transform:none;justify-items:start}
.cm.due{transform:translateX(-100%);justify-items:end}
.pairs{display:grid;gap:8px}
.pkey{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.pkey .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.prow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.pbars{display:grid;gap:3px}
.pv{text-align:right;line-height:1.2}
@media (max-width:480px){.prow{grid-template-columns:minmax(0,1fr) auto}.pbars{grid-column:1/-1;grid-row:2}}

.cbar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--rule);background:var(--rule2)}
.cbar > i{display:block;height:100%;border-right:2px solid var(--sheet)}
.cbar > i:last-child{border-right:0}
.cbar > i.free{background:repeating-linear-gradient(135deg,var(--rule2) 0 6px,var(--sheet) 6px 9px)}
.clegend{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 14px;font-size:.92rem;align-items:center}
.clegend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;background:var(--c)}
.clegend .sw.free{background:repeating-linear-gradient(135deg,var(--rule) 0 3px,var(--sheet) 3px 5px);border:1px solid var(--rule)}
.clegend .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.clegend .p{color:var(--muted);font-family:var(--f-mono);text-align:right;min-width:3.5em}
.clegend .tot{font-weight:700;border-top:1px solid var(--rule);padding-top:4px}
.bighead{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline}
.bighead > b{font:600 2rem/1.1 var(--f-mono)}
.events{display:grid}

.kplan{border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--bg);display:grid;gap:10px;min-width:0}
.kplan.done{opacity:.7}
.kh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 12px;align-items:flex-start}
.kinst{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.ki{border:1px solid var(--rule);border-radius:8px;padding:8px 10px;background:var(--sheet);display:grid;gap:2px;justify-items:start;min-width:0}
.ki.paid{border-color:var(--ok)}
.ki.now{outline:2px solid var(--ink);outline-offset:-1px}
.ki small{color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.tip{border-left:3px solid var(--joint);background:var(--joint-t);padding:8px 12px;border-radius:0 8px 8px 0;font-size:.93rem;max-width:72ch}
.vbar{height:8px;border-radius:999px;background:var(--rule2);overflow:hidden;min-width:80px;position:relative}
.vbar i{display:block;height:100%;background:var(--bills);border-radius:999px}
.vbar s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink)}
.vsave{display:flex;gap:6px;align-items:center}
.vsave input{width:90px;background:var(--bg);border:1px solid var(--rule);border-radius:6px;padding:4px 6px}
.year{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:760px){.year{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:420px){.year{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mon{border:1px solid var(--rule);border-radius:10px;padding:8px 10px;background:var(--bg);display:grid;gap:4px;align-content:start;min-width:0}
.mon.heavy{border-color:var(--warn);background:var(--warn-t)}
.mon .mh{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:.9rem}
.mon .mh span{font-family:var(--f-mono);font-weight:600}
.mon small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}
.cat{display:inline-block;font-size:.8rem;border:1px solid var(--rule);border-radius:999px;padding:1px 8px;white-space:nowrap;background:var(--bg)}
.cats{display:grid;gap:8px}
.catrow{display:grid;grid-template-columns:minmax(0,10rem) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.92rem}
.catrow .bar{height:10px;border-radius:999px;background:var(--rule2);overflow:hidden}
.catrow .bar i{display:block;height:100%;background:var(--joint);border-radius:999px}
@media (max-width:480px){.catrow{grid-template-columns:minmax(0,1fr) auto}.catrow .bar{grid-column:1/-1;grid-row:2}}
/* transfers */
.xsteps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:x}
.xstep{counter-increment:x;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;align-items:start;border:1px solid var(--rule);border-radius:10px;padding:12px;background:var(--sheet)}
.xstep::before{content:counter(x);grid-row:span 4;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--sheet);font:700 .9rem var(--f-mono)}
.xstep .route{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:600;min-width:0}
.xstep .amt{font:600 1.25rem var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.xstep .when,.xstep .note,.xstep .chk{grid-column:2/-1}
.xstep .when{color:var(--muted);font-size:.88rem}
.xstep .note{font-size:.92rem}
.xstep.done{border-color:var(--ok);background:var(--ok-t)}
.xsteps.plain .xstep{grid-template-columns:minmax(0,1fr) auto}
.xsteps.plain .xstep::before{display:none}
.xsteps.plain .xstep .when,.xsteps.plain .xstep .note,.xsteps.plain .xstep .chk{grid-column:1/-1}
@media (max-width:480px){.xstep{grid-template-columns:30px minmax(0,1fr)}.xstep .amt{text-align:left;grid-column:2}}

/* ledger rows */
.ledger{display:grid}
.lrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:2px 12px;padding:9px 2px;border-bottom:1px solid var(--rule2);align-items:baseline}
.lrow:last-child{border-bottom:0}
.lrow .d{font:600 .85rem var(--f-mono);color:var(--muted)}
.lrow .n{min-width:0}
.lrow .n small{display:block;color:var(--muted);font-size:.85rem}
.lrow .a{font:600 .97rem var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.lrow.past{opacity:.55}
.advorder{margin:0;padding-left:1.4em;display:grid;gap:8px}
.advorder li b{display:block}.advorder li small{display:block;color:var(--muted);font-size:.86rem}
.advorder li.done{opacity:.6}.advorder li.now b{color:var(--ink)}.advorder li.now{font-weight:600}
.donts{margin:0;padding-left:0;list-style:none;display:grid;gap:6px}.donts li{color:var(--ink)}
.wish2{border:1px solid var(--rule2);border-radius:12px;padding:12px;margin:10px 0;display:grid;gap:8px}
.wish2 .wh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.wish2 .wm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wish2 .verdict{margin:0}
.mvnote{font-size:.9rem;line-height:1.4;margin:6px 0;padding:8px 10px;border-radius:8px;border-left:4px solid currentColor}
.mvnote.ok{color:var(--ok);background:var(--ok-t)} .mvnote.warn{color:var(--warn);background:var(--warn-t)} .mvnote.bad{color:var(--bad);background:var(--bad-t)}

 .fact:last-child{border-bottom:0}
.fact .fh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.fact .fh b:last-child{font:600 .95rem var(--f-mono);white-space:nowrap}
.fact small{display:block;color:var(--muted);font-size:.85rem;margin-top:2px}

/* card */
.cardbig{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.cardbig b{font:600 2rem/1 var(--f-mono);font-variant-numeric:tabular-nums}
.track{height:12px;background:var(--rule2);border-radius:999px;overflow:hidden}
.fill{height:100%;background:var(--ok);border-radius:999px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;background:var(--bg);display:grid;gap:2px;min-width:0}

/* report */

:root[data-look="ios"]{
  --bg:#F2F2F7; --sheet:#FFFFFF; --ink:#000000; --muted:#6E6E73; --rule:#D1D1D6; --rule2:#E5E5EA; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --accent:#007AFF; --accent-t:rgba(0,122,255,.12);
  --joint:#007AFF; --bills:#248A3D; --pocket:#AF52DE; --personal:#C27C0E;
  --ok:#248A3D; --warn:#C93400; --bad:#D70015; --okf:#34C759; --warnf:#FF9500; --badf:#FF3B30;
  --ok-t:rgba(52,199,89,.14); --warn-t:rgba(255,149,0,.15); --bad-t:rgba(255,59,48,.12);
  --bills-t:rgba(52,199,89,.12); --joint-t:rgba(0,122,255,.10); --pocket-t:rgba(175,82,222,.12); --personal-t:rgba(255,149,0,.12);
  --shield-bg:#FFFFFF; --shield-fg:#000; --shield-mut:#6E6E73;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root[data-look="ios"]:not([data-theme="light"]){
  --bg:#000000; --sheet:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --rule:#38383A; --rule2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --accent:#0A84FF; --accent-t:rgba(10,132,255,.18); --joint:#0A84FF; --bills:#30D158; --pocket:#BF5AF2; --personal:#FFB340;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A; --okf:#30D158; --warnf:#FF9F0A; --badf:#FF453A;
  --ok-t:rgba(48,209,88,.16); --warn-t:rgba(255,159,10,.16); --bad-t:rgba(255,69,58,.16);
  --bills-t:rgba(48,209,88,.14); --joint-t:rgba(10,132,255,.16); --pocket-t:rgba(191,90,242,.16); --personal-t:rgba(255,179,64,.14);
  --shield-bg:#1C1C1E; --shield-fg:#FFF; --shield-mut:#98989F; color-scheme:dark}}
:root[data-look="ios"][data-theme="dark"]{
  --bg:#000000; --sheet:#1C1C1E; --ink:#FFFFFF; --muted:#98989F; --rule:#38383A; --rule2:#2C2C2E; --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.16);
  --accent:#0A84FF; --accent-t:rgba(10,132,255,.18); --joint:#0A84FF; --bills:#30D158; --pocket:#BF5AF2; --personal:#FFB340;
  --ok:#30D158; --warn:#FF9F0A; --bad:#FF453A; --okf:#30D158; --warnf:#FF9F0A; --badf:#FF453A;
  --ok-t:rgba(48,209,88,.16); --warn-t:rgba(255,159,10,.16); --bad-t:rgba(255,69,58,.16);
  --shield-bg:#1C1C1E; --shield-fg:#FFF; --shield-mut:#98989F; color-scheme:dark}

[data-look="ios"] .wrap{max-width:720px;padding-top:0;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
[data-look="ios"] header.top{display:none}
[data-look="ios"] body.rorymode header.top{display:flex}
[data-look="ios"] .mono,[data-look="ios"] .num{font-variant-numeric:tabular-nums;letter-spacing:0}
[data-look="ios"] h1,[data-look="ios"] h2,[data-look="ios"] h3{letter-spacing:-.02em}
[data-look="ios"] .label{font:600 .8rem var(--f-body);text-transform:none;letter-spacing:0;color:var(--muted)}
/* cards */
[data-look="ios"] .panel{border:0;border-radius:16px;padding:16px;gap:12px}
[data-look="ios"] .panel > header h2{font-size:1.25rem;font-weight:700}
[data-look="ios"] .stack{gap:20px}
[data-look="ios"] .gt{border:0;border-radius:16px;background:var(--sheet)}
[data-look="ios"] .verdict{border:0;border-radius:14px}
[data-look="ios"] .banner{border:0;border-radius:14px;background:var(--warn-t)}
[data-look="ios"] .tip{border-left:0;border-radius:12px;background:var(--accent-t)}
[data-look="ios"] .chip{border-radius:999px;font-weight:600}
[data-look="ios"] table th{font:600 .78rem var(--f-body);text-transform:none;letter-spacing:0}
/* controls */
[data-look="ios"] .btn{border:0;border-radius:12px;background:var(--accent-t);color:var(--accent);font:600 1rem var(--f-body);min-height:44px;padding:10px 16px;letter-spacing:-.01em}
[data-look="ios"] .btn.strong{background:var(--accent);color:#fff}
[data-look="ios"] .btn.danger{background:var(--bad-t);color:var(--bad)}
[data-look="ios"] .btn.small{min-height:32px;padding:5px 12px;border-radius:999px;font-size:.88rem}
[data-look="ios"] .btn:active{opacity:.6}
[data-look="ios"] .fld label,[data-look="ios"] .fld .label{font:500 .85rem var(--f-body);color:var(--muted);text-transform:none;letter-spacing:0}
[data-look="ios"] input:not([type=checkbox]):not([type=radio]),[data-look="ios"] select,[data-look="ios"] textarea{border:0;border-radius:10px;background:var(--fill);font-size:17px;min-height:44px;padding:10px 12px}
[data-look="ios"] input:focus,[data-look="ios"] select:focus,[data-look="ios"] textarea:focus{outline:2px solid var(--accent);outline-offset:0}
[data-look="ios"] .seg{background:var(--fill);border:0;border-radius:9px;padding:2px;gap:2px}
[data-look="ios"] .seg button{border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 .9rem var(--f-body);min-height:32px}

[data-look="ios"] input[type=checkbox]{accent-color:var(--okf);width:22px;height:22px}
[data-look="ios"] .subnav{background:var(--fill);border-radius:9px;padding:2px;gap:2px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
[data-look="ios"] .subnav::-webkit-scrollbar{display:none}
[data-look="ios"] .subnav button{flex:1 0 auto;border:0;border-radius:7px;background:transparent;color:var(--ink);font:500 .88rem var(--f-body);padding:7px 12px}

/* large title and the small bar that appears when scrolling */
.ios-title{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(10px + env(safe-area-inset-top,0px)) 2px 14px}
.ios-title h1{font:700 2.1rem/1.1 var(--f-display);letter-spacing:.01em}
.ios-title p{color:var(--muted);font-size:.95rem;margin-top:4px;font-weight:500}
.ios-iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--fill);color:var(--accent);display:grid;place-items:center;cursor:pointer;flex:none}
.ios-iconbtn svg{width:22px;height:22px}
[data-look="ios"] .ios-nav{display:flex;position:fixed;top:0;left:0;right:0;z-index:40;justify-content:center;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--rule);font:600 1.05rem var(--f-display);opacity:0;pointer-events:none;transition:opacity .2s}
[data-look="ios"] .ios-nav.on{opacity:1}
/* tab bar */
[data-look="ios"] .iostabs{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:45;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--sheet) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--rule)}
[data-look="ios"] .toast{bottom:calc(75px + env(safe-area-inset-bottom,0px));z-index:61}   /* above the tab bar (63px) and over an open sheet, never under them */
[data-look="ios"] body.rorymode .iostabs,[data-look="ios"] body.rorymode .ios-nav{display:none}

.iostabs button svg{width:26px;height:26px}

.iostabs .badge{position:absolute;top:-2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--badf);color:#fff;font:600 .7rem/18px var(--f-body);padding:0 5px}
/* Today */
.ios-next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:center;background:var(--sheet);border-radius:18px;padding:16px}
.ios-next .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--accent)}
.ios-next .ico.bad{background:var(--badf)} .ios-next .ico.warn{background:var(--warnf)} .ios-next .ico.ok{background:var(--okf)}
.ios-next .ico svg{width:24px;height:24px}
.ios-next small{display:block;color:var(--muted);font:600 .78rem var(--f-body);text-transform:uppercase;letter-spacing:.04em}
.ios-next b{display:block;font:600 1.05rem/1.3 var(--f-body);margin-top:2px}
.ios-next .actions{grid-column:1/-1;margin:0}
.ios-next .actions .btn{width:100%}
.ios-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ios-tile{background:var(--sheet);border:0;border-radius:18px;padding:14px;text-align:left;display:grid;gap:4px;cursor:pointer;min-width:0;color:var(--ink)}
.ios-tile .t{display:flex;align-items:center;gap:6px;font:600 .82rem var(--f-body);color:var(--muted)}
.ios-tile .t svg{width:16px;height:16px}
.ios-tile b{font:700 1.6rem/1.15 var(--f-display);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.ios-tile small{color:var(--muted);font-size:.8rem;line-height:1.3}
.ios-tile .bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}.ios-tile .bar i{display:block;height:100%;background:var(--okf);border-radius:3px}
.ios-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.bigline{font-size:1.05rem;margin:0 0 8px}ul.plain{margin:4px 0 10px;padding-left:18px;display:grid;gap:4px}ul.plain li{font-size:.9rem;line-height:1.4}
.ios-act{border:0;background:var(--sheet);border-radius:16px;padding:12px 6px;display:grid;justify-items:center;gap:6px;cursor:pointer;color:var(--ink);font:500 .82rem var(--f-body);position:relative}
.ios-act span.c{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-t);color:var(--accent)}
.ios-act span.c svg{width:24px;height:24px}
.ios-act .badge{position:absolute;top:8px;right:calc(50% - 30px);min-width:20px;height:20px;border-radius:10px;background:var(--badf);color:#fff;font:600 .72rem/20px var(--f-body);padding:0 6px}
.ios-sec{display:grid;gap:8px}
.ios-sec > h2{font:700 1.3rem var(--f-display);padding:0 4px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ios-sec > h2 small{font:500 .9rem var(--f-body);color:var(--muted)}
.ios-list{background:var(--sheet);border-radius:16px;overflow:hidden}
.ios-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;min-height:52px;border:0;background:none;width:100%;text-align:left;color:var(--ink);font:inherit;cursor:pointer;position:relative}
.ios-row + .ios-row::before{content:"";position:absolute;top:0;left:50px;right:0;border-top:.5px solid var(--rule)}
.ios-row .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);margin:0 6px}
.ios-row .dot.bad{background:var(--badf)} .ios-row .dot.warn{background:var(--warnf)} .ios-row .dot.ok{background:var(--okf)} .ios-row .dot.idle{background:#C7C7CC}
.ios-row .txt{font-size:.95rem;line-height:1.35}
.ios-row .txt small{display:block;color:var(--muted);font-size:.82rem}
.ios-row .end{display:flex;align-items:center;gap:6px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ios-row .end svg{width:14px;height:14px;opacity:.5}
.ios-row.done .txt{color:var(--muted)} .ios-row.done .end{color:var(--ok)}
.ios-day{width:38px;text-align:center;line-height:1.1}
.ios-day small{display:block;font:600 .66rem var(--f-body);color:var(--badf);text-transform:uppercase}
.ios-day b{font:500 1.2rem var(--f-display)}
.ios-adv{display:grid;gap:6px;background:var(--sheet);border-radius:18px;padding:16px;border:0;text-align:left;cursor:pointer;color:var(--ink);width:100%}
.ios-adv .top2{display:flex;justify-content:space-between;align-items:center;gap:8px;font:600 .82rem var(--f-body);color:var(--muted)}
.ios-adv b{font:600 1.05rem/1.3 var(--f-body)}
.ios-adv p{color:var(--muted);font-size:.9rem}
.ios-pill{display:inline-block;border-radius:999px;padding:3px 10px;font:600 .78rem var(--f-body)}
.ios-pill.bad{background:var(--bad-t);color:var(--bad)} .ios-pill.warn{background:var(--warn-t);color:var(--warn)} .ios-pill.ok{background:var(--ok-t);color:var(--ok)}
.ios-quote{color:var(--muted);font-size:.92rem;font-style:italic;padding:0 6px;text-align:center}
.ios-more{border:0;background:none;color:var(--accent);font:500 .95rem var(--f-body);padding:4px;cursor:pointer;justify-self:start}
/* sheets */
.ios-sheet{position:fixed;inset:0;z-index:60;display:grid;align-items:end;background:rgba(0,0,0,.32)}
.ios-sheet .sh{background:var(--bg);border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));width:100%;max-width:720px;justify-self:center}
.ios-sheet.enter{animation:shfade .25s ease}.ios-sheet.enter .sh{animation:shup .32s cubic-bezier(.2,.8,.2,1)}
@keyframes shup{from{transform:translateY(100%)}to{transform:none}} @keyframes shfade{from{background:rgba(0,0,0,0)}}
.ios-sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--rule);margin:0 auto 6px}
.ios-sheet .shh{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:4px 0 12px;position:sticky;top:-8px;background:var(--bg);z-index:1}
.ios-sheet .shh b{font:600 1.05rem var(--f-display)}
.ios-sheet .shh button{border:0;background:none;color:var(--accent);font:400 1.05rem var(--f-body);cursor:pointer;justify-self:start;padding:8px 0}
.ios-sheet .panel{background:var(--sheet)}
@media (prefers-reduced-motion: reduce){.ios-sheet.enter,.ios-sheet.enter .sh{animation:none}}
body.sheet-open{overflow:hidden}
/* the selected tab and choice stand out: a tinted capsule, the accent colour, and a slightly raised look */
.iostabs button{flex:1;max-width:96px;border:0;background:none;display:grid;justify-items:center;gap:2px;color:#8E8E93;font:500 .66rem var(--f-body);cursor:pointer;position:relative;isolation:isolate;padding:5px 0 4px}
.iostabs button::before{content:"";position:absolute;inset:0 4px;border-radius:16px;background:transparent;z-index:-1;transition:background .2s,box-shadow .2s}
.iostabs button[aria-selected="true"]{color:var(--accent);font-weight:700}
.iostabs button[aria-selected="true"]::before{background:var(--accent-t);box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--accent) 30%,transparent)}
.iostabs button[aria-selected="true"] svg{stroke-width:2.3}
[data-look="ios"] .subnav button[aria-selected="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--sheet));color:var(--accent);font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.14),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
[data-look="ios"] .seg button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 14%,var(--sheet));color:var(--accent);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.14),0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.ios-sheet .panel > header{display:none}
/* sizes for the iPhone: one column, calmer text, tables as cards, compact weekly steps */
[data-look="ios"] body{font:16px/1.35 var(--f-body);letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
[data-look="ios"] .panel > p,[data-look="ios"] .panel > p.mut,[data-look="ios"] .panel > .mut{font-size:.94rem;line-height:1.45}
[data-look="ios"] .panel > header .mut{font-size:.82rem!important}
[data-look="ios"] small{font-size:.8rem}
[data-look="ios"] .kv{font-size:.95rem}
[data-look="ios"] .bighead > b{font-size:1.9rem}
[data-look="ios"] .fld label small,[data-look="ios"] .fld .label small{display:block;font-size:.75rem;font-weight:400;margin-top:1px;line-height:1.3}
[data-look="ios"] .verdict h3{font-size:1.08rem}
[data-look="ios"] .verdict p{font-size:.94rem}
@media (max-width:700px){
  [data-look="ios"] .form{grid-template-columns:minmax(0,1fr);gap:12px}
  [data-look="ios"] .form > .fld{grid-column:1/-1}
  [data-look="ios"] .actions > .btn.strong{flex:1 1 100%}
  [data-look="ios"] .year{grid-template-columns:repeat(2,minmax(0,1fr))}
  [data-look="ios"] .gtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  [data-look="ios"] .two{grid-template-columns:minmax(0,1fr)}
  /* tables become one card per row: the first column is the title, the rest label + value */
  [data-look="ios"] .tablewrap.cards{border:0;overflow:visible;border-radius:0}
  [data-look="ios"] table.cards thead{display:none}
  [data-look="ios"] table.cards,[data-look="ios"] table.cards tbody{display:block;width:100%}
  [data-look="ios"] table.cards tbody{display:grid;gap:8px}
  [data-look="ios"] table.cards tr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;background:var(--fill2);border-radius:14px;padding:12px 14px}
  [data-look="ios"] table.cards tr.off{opacity:.6}
  [data-look="ios"] table.cards td{display:block;padding:0;border:0;min-width:0;text-align:left!important;font-size:.92rem}
  [data-look="ios"] table.cards td:first-child{grid-column:1/-1;font-weight:600;font-size:1rem}
  [data-look="ios"] table.cards td[data-l]:not(:first-child)::before{content:attr(data-l);display:block;font:500 .72rem var(--f-body);color:var(--muted);margin-bottom:1px}
  [data-look="ios"] table.cards td.c-empty{display:none}
  [data-look="ios"] table.cards td.c-wide{grid-column:1/-1}
  [data-look="ios"] table.cards td.c-act{grid-column:1/-1}
  [data-look="ios"] table.cards td.c-act .btn{width:100%}
  [data-look="ios"] table.cards tfoot,[data-look="ios"] table.cards tfoot tr{display:block}
}
/* Compare: plans side by side, one card each */
.cmpplan{border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:10px;min-width:0}
.cmph{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.cmph > b{flex:1 1 auto;min-width:0}
.cmph > .mut{font-size:.88rem}
.cmpcard{border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--rule2);border-left:4px solid var(--muted);min-width:0}
.cmpcard.ok{border-left-color:var(--ok)} .cmpcard.warn{border-left-color:var(--warn)} .cmpcard.bad{border-left-color:var(--bad)}
.cmpwhy{list-style:none;padding-left:0}
.cmpwhy li.bad{color:var(--bad)} .cmpwhy li.warn{color:var(--warn)} .cmpwhy li.ok{color:var(--ok)}
.cmpgo{display:grid;gap:6px;border-top:1px solid var(--rule);padding-top:10px}
[data-look="ios"] .cmpplan{border:0;background:var(--fill)}
[data-look="ios"] .cmpcard{background:var(--fill)}
.cmprow{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center}
.cmprow + .cmprow,.cmpdelnote + .cmprow{border-top:.5px solid var(--rule)}
.cmpdel{border:0;background:none;color:var(--bad);min-width:48px;min-height:52px;padding:0 12px;cursor:pointer;font:600 .85rem var(--f-body);display:grid;place-items:center}
.cmpdel svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cmpdel.on{background:var(--bad);color:#fff;border-radius:999px;min-height:32px;margin-right:10px;padding:0 14px}
.cmpdelnote{font-size:.85rem;color:var(--bad);padding:0 14px 12px}
.cmppick{justify-self:start;margin-top:4px;display:inline-block}
.cmpdecide{border-radius:14px;padding:14px;background:var(--rule2);display:grid;gap:10px;min-width:0}
[data-look="ios"] .cmpdecide{background:var(--fill)}
.cmpsteps{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.cmpsteps li{display:grid;gap:2px}
.cmpsteps li b{font-weight:600}
.cmpsteps li.ok b{color:var(--ok)}
.cmpsteps small{color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.cmpstep{font-size:.9rem;color:var(--muted)}
.cmpuse{display:grid;gap:6px;padding:10px 0 4px;border-top:.5px solid var(--rule)}
.cmpans{display:grid;gap:8px}
.bask{border:2px solid var(--warn)}
@media (max-width:430px){[data-look="ios"] .subnav button{padding:7px 7px;font-size:.8rem}}
/* phone fit: every line fits the phone screen, nothing squeezed into a narrow column */
.cycleg{display:none}
.dleg{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:5px 12px;font-size:.9rem;align-items:center;min-width:0;flex:1 1 240px}
.bsmall:not(:has(.bi)){display:block}
@media (max-width:700px){
  .kv{grid-template-columns:fit-content(50%) minmax(0,1fr);gap:6px 12px;align-items:baseline}
  .kv span:nth-child(odd) small{display:block;font-size:.78rem}
  .kv span:nth-child(even){overflow-wrap:anywhere}

const shortRoute = (from, to) => `${String(from).replace(/^Rory's personal$/, 'Rory').replace(/^Thiago's personal$/, 'Thiago').replace(/^Joint account.*$/, 'Joint')} → ${String(to).replace(/^Vault · /, 'Vault ').replace(/^Joint account$/, 'Joint')}`;
function weekMoves(ws){   // every money movement planned for the week, and whether it was confirmed
  const wsI = iso(ws), w = S.weeks[wsI] || {}, tr = w.transfers || {}, am = w.amounts || {}, out = [];
  for (const x of stepsFor(ws)){
    if (x.amount == null || x.id === 'card') continue;
    const real = tr[x.id] ? stepSent(wsI, x) : am[x.id] && has(am[x.id].a) ? num(am[x.id].a) : null;
    out.push({n: shortRoute(x.from, x.to), plan: am[x.id] && has(am[x.id].p) ? num(am[x.id].p) : tr[x.id] ? stepSent(wsI, x) : x.amount, real, done: !!tr[x.id]});   // a ticked week with no plan saved: what was sent was the plan
  }
  const cp = weekCardPay(wsI);
  if (num(st().cardWeekly) > 0 || cp) out.push({n: 'AIB savings → AIB card', plan: num(st().cardWeekly), real: cp ? num(cp.amount) : null, done: !!cp});
  for (const m of dueMoves(ws, 6)) out.push({n: `${shortRoute(m.from, m.to)} · ${m.b.name}`, plan: m.amount, real: null, done: moveDone(m), on: m.sendBy});
  for (const m of movesIn(ws, addDays(ws, 6)).filter(m => !m.due)) out.push({n: isAdd(m) ? `${addLabel(m)}${m.note ? ` · ${String(m.note).slice(0, 22)}` : ''}` : `${mvRoute(m)} · ${m.note ? String(m.note).slice(0, 22) : mvBreak(m) ? `rule ${mvBreak(m)}` : 'by hand'}`, plan: num(m.amount), real: num(m.amount), done: true, extra: true, brk: mvBreak(m)});

}
function weekBills(ws){   // bills and debts that fell in the week, with what was confirmed

    const before = pd(st().startedOn) && it.on < pd(st().startedOn);
    const st0 = h ? 'ok' : it.on > t || auto || before ? 'idle' : 'bad';
    const plan = h && h.planned != null ? num(h.planned) : h && h.held != null ? num(h.held) : num(b.amount);
    out.push({d: it.on, n: occName(b, it.d), a: h ? num(h.amount ?? h.eur) : it.amount, plan, st: st0,
      sub: h ? (Math.abs(num(h.amount ?? h.eur) - plan) >= .5 ? `paid · bill was ${m0(plan)}` : 'paid') : it.on > t ? `due ${fWD.format(it.on)}` : before ? 'direct debit · before we started logging' : auto ? 'direct debit · not confirmed yet' : 'not paid yet'});
  }
  for (const k of S.loans.flatMap(loanInst).concat(S.klarna.flatMap(klarnaInst))) if (k.d >= ws && k.d <= we) out.push({d: k.d, n: k.l ? loanLabel(k) : klarnaLabel(k), a: k.amount, st: k.d <= t ? 'ok' : 'idle', sub: k.d <= t ? 'taken automatically' : `due ${fWD.format(k.d)}`});

}

/* ---------- does the money add up? (money check reconciliation) ---------- */
const CHK_KEYS = ['joint', 'bills', 'vaults', 'ef', 'aib', 'card'];
const efInUse = () => num(PL().efWeekly) > 0 || has(PL().efBalance);
function efStart(){ const d = [PL().efOn].concat(S.checks.filter(c => has(c.ef)).map(c => c.date)).filter(x => pd(x)).sort()[0]; return d || null; }
const chkComplete = c => ['joint', 'bills', 'vaults', 'aib', 'card'].every(k => has(c[k])) && (has(c.ef) || !efInUse() || !efStart() || c.date < efStart());
const poolOf = c => num(c.joint) + num(c.bills) + num(c.vaults) + num(c.ef) + num(c.aib) - num(c.card);
const localDay = stamp => { const x = new Date(stamp); return isNaN(x) ? null : new Date(x.getFullYear(), x.getMonth(), x.getDate()); };
function paydayRows(a, z){   // what each payday really brought into the Joint account: the day it arrived and its real amount once ticked; the plan for a payday not ticked
  const s = st(), fl = flow(), out = [];
  for (let ws = weekStartOf(addDays(a, 1)); ws <= z; ws = addDays(ws, 7)){
    const w = S.weeks[iso(ws)] || {}, tr = w.transfers || {}, at = w.transfersAt || {}, am = w.amounts || {};
    for (const [id, key, plan] of [['rory', 'paydayRory', toJointPay('rory')], ['thiago', 'paydayThiago', toJointPay('thiago')]]){
      const pdx = payDate(id, ws); if (!pdx && payFreq(id) !== 'weekly') continue;   // no pay that week
      const due = pdx ? pdx.d : addDays(ws, 4);   // bank holidays included
      let d = due, amt = plan;
      if (tr[id]){ const td = at[id] ? localDay(at[id]) : null; if (td && td < due) d = td;   // money that came early counts the day it came; a late tick still counts on payday
        amt = am[id] && has(am[id].a) ? num(am[id].a) : am[id] && has(am[id].p) ? num(am[id].p) : plan; }
      if (d && d > a && d <= z && amt > 0) out.push({kind: 'in', name: `${STEP_IN[id]} → Joint${tr[id] ? '' : ' (planned, not ticked yet)'}`, amt, d});
    }
  }
  return out;
}
function flowRows(a, z, card0, opt = {}){ // money in and out of our shared accounts between a (exclusive) and z (inclusive)
  const s = st(), fl = flow();
  const inR = d => d && d > a && d <= z, rows = [], sIn = (x, stamp) => opt.sA ? stamp > opt.sA && stamp <= opt.sZ && !!pd(x.date) : inR(pd(x.date));   // between two money checks: by the time it was logged
  const add = (kind, name, amt, d) => { if (Math.abs(amt) >= 0.005) rows.push({kind, name, amt, d: d || null}); };
  for (const r of paydayRows(a, z)) add(r.kind, r.name, r.amt, r.d);
  for (const e of S.cardlog) if (e.type === 'refund' && inR(pd(e.date))) add('in', `Refund to the card${e.note ? ` (${e.note})` : ''}`, num(e.amount), pd(e.date));
  for (const b of billsTimeline()){
    if (['rory', 'thiago', 'nubank'].includes(b.account)) continue;   // Brazil bills are counted by the Wise transfer
    for (const o of billDays(b, addDays(opt.billA || a, 1), opt.billZ || z)) add('bill', occName(b, o.due), -occAmount(b, o.due), o.d);
  }
  for (const k of S.loans.flatMap(loanInst)) if (!['rory', 'thiago'].includes(k.l.paidFrom || 'bills') && inR(k.d)) add('bill', loanLabel(k), -k.amount, k.d);
  for (const k of S.klarna.flatMap(klarnaInst)) if (!['rory', 'thiago'].includes(k.p.paidFrom || 'card') && inR(k.d)) add('bill', klarnaLabel(k), -k.amount, k.d);
  for (const e of S.cardlog) if (e.type === 'scheduled' && inR(pd(e.date))) add('bill', e.note || 'Card charge', -num(e.amount), pd(e.date));
  for (const w of S.wise) if (inR(pd(w.date))) add('bill', `Wise → Nubank${w.purpose ? ` (${w.purpose})` : ''}`, -num(w.eur), pd(w.date));
  { const apr = cardRateY(), cc = cardCycles(), real = cardIntLog();   // AIB adds interest once a month, on the statement date: the real amount once it's typed from the statement, an estimate until then
    for (const e of real){ const on = pd(e.date); if (inR(on)) add('bill', `Card interest on the ${dshort(pd(e.stmt))} statement`, -num(e.amount), on); }
    if (apr > 0 && num(card0) > 0){
      if (cc && !cc.estimated){ cc.list.forEach((c, i) => { const on = addDays(c.S, 1); if (inR(on) && !cardIntFor(iso(c.S))) add('bill', `Card interest on the ${dshort(c.S)} statement (estimate)`, -num(card0) * apr / 365 * (i ? dayDiff(cc.list[i - 1].S, c.S) : 30), on); }); }   // it reaches the card balance overnight after the statement
      else if (!real.some(e => inR(pd(e.date)))) add('bill', 'Card interest (estimate)', -num(card0) * apr / 365 * dayDiff(a, z));   // statement day unknown: spread day by day
    } }
  for (const x of S.spending) if (['joint', 'card', 'bills'].includes(x.paidFrom) && !x.sched && sIn(x, spendStamp(x))) add('spend', x.what || 'Purchase', -num(x.amount), pd(x.date));   // pre-orders are counted by their card charge above
  for (const m of S.moves) if (sIn(m, mvStamp(m))){   // moves between our own accounts change nothing; money from outside or out to a personal account does
    if (m.to === 'cash' || m.from === 'cash'){ if (inPool(m.from) !== inPool(m.to)) add('cash', `${mvRoute(m)} (cash at home)`, inPool(m.from) ? -num(m.amount) : num(m.amount), pd(m.date)); }
    else if (mvIn(m)) add('in', isAdd(m) ? `${addLabel(m)}${m.note ? ` (${m.note})` : ''}` : `${mvRoute(m)}${m.note ? ` (${m.note})` : ''}`, num(m.amount), pd(m.date));
    else if (mvOut(m)) add('out', `${mvRoute(m)}${m.note ? ` (${m.note})` : ''}`, -num(m.amount), pd(m.date));
  }
  { const i = efInterestBetween(a, z); if (i) add('in', 'Savings interest, after DIRT (estimate)', i); }
  return rows;
}
function reconcile(c0, c1){

  const sum = k => rows.filter(r => r.kind === k).reduce((t, r) => t + r.amt, 0);
  const expected = rows.reduce((t, r) => t + r.amt, 0), actual = poolOf(c1) - poolOf(c0), gap = actual - expected;
  const tol = Math.max(15, rows.reduce((t, r) => t + Math.abs(r.amt), 0) * 0.02);

    <h3>The plain approach</h3>
    <div class="facts">
      <p class="fact">What has worked for most ordinary savers: the <b>same amount every month</b> into a <b>broad, low-cost index fund</b> (many companies, often hundreds or thousands), held for 10 years or more, without selling when it falls.</p>
      <p class="fact">“Following the trends” (hot shares, whatever is in the news, crypto, day trading) is where most beginners lose money. Nobody, including us here, can tell you what will go up next.</p>

      <p class="fact"><b>Thiago:</b> people not domiciled in Ireland can be taxed differently on foreign gains. Ask a tax adviser before investing in Thiago’s name.</p>
    </div>
    <p class="mut" style="font-size:.85rem">General information, not financial advice. Claude isn’t a financial adviser. For a personal recommendation, see a qualified adviser; MABS (mabs.ie) gives free money advice.</p>

async function planWrite(patch, logs){

async function planSave(){

  for (const [k, l] of [['efWhere', 'Emergency fund kept in'], ['roryPay', 'Rory’s pension paid']]){ const nv = String(v[k] || '').trim(), ov = String(old[k] || ''); if (nv !== ov){ logs.push(['plan', `${l}: ${ov || 'not set'} → ${nv || 'not set'}`]); patch[k] = nv || null; } }

}

/* ---------- Bills Pocket review: once every bill is in, the lowest weekly transfer that still pays every bill on its day, and where the money it frees goes ---------- */
const POCKET_FLOOR = 50;   // the Bills Pocket never planned to go below this
function safeTransfer(opt = {}){   // the lowest weekly amount (in €5 steps, never below the weekly average of the bills) that passes the day-by-day test for 26 weeks; opt: a plan in or bills out (Compare)
  const fl = flow(); if (!fl.configured || !(fl.needBills > 0)) return null;
  const tB = num(st().transferBills), lo = Math.max(0, Math.ceil((fl.needBills + num(opt.needDelta) - .001) / 5) * 5);
  const cut = addDays(today(), 7);   // a shortfall in the next 7 days can't be fixed by the weekly amount: it needs a one-off top-up (To do), and the weekly amount is judged after it
  for (let v = lo; v <= Math.max(lo, tB) + 300; v += 5){
    const owed = potOwed('bills').owe;   // money owed back to the Bills Pocket (rule 1) is put back, not paid for by a higher transfer
    const s0 = pocketSim({days: 182, tB: v, topUp: owed, extra: opt.extra, drop: opt.drop}); if (!s0) return null;
    const early = Math.min(s0.s0.v + owed, ...s0.rows.filter(r => r.d <= cut).map(r => r.after)), top = early < 0 ? Math.ceil(-early) : 0;
    const sm = top ? pocketSim({days: 182, tB: v, topUp: owed + top, extra: opt.extra, drop: opt.drop}) : s0;
    if (!sm.first && sm.min.v >= POCKET_FLOOR) return {v, min: sm.min, top};
  }
  return null;
}
const PR_GOAL = {ef: 'the emergency fund', card: 'the AIB card'};
function pocketReview(){

  const v = (() => {
    const fl = flow(); if (!fl.configured || !(fl.needBills > 0)) return null;
    const s = st(), tB = num(s.transferBills), sf = safeTransfer(), complete = !s.holdBills, applied = s.pocketReview || null;
    if (!sf) return {tB, need: fl.needBills, safe: null, complete, applied};
    const freed = Math.max(0, tB - sf.v), raise = Math.max(0, sf.v - tB);

    const toGap = known ? Math.min(freed, gap) : freed, rest = known ? Math.floor((freed - toGap) / 5) * 5 : 0, stays = Math.round((freed - rest) * 100) / 100;

    const minFree = applied && pd(applied.on) && dayDiff(pd(applied.on), today()) < 56 ? 20 : 5;   // just changed: only offer again for a real difference
    return {offer: complete && freed >= minFree, minFree, tB, need: fl.needBills, safe: sf.v, min: sf.min, top: sf.top, freed, raise, complete, known, gap, toGap, stays, rest, goal, applied, P, cs};

const CMP_USE = {need: 'We need it', some: 'Sometimes', never: 'Never'};

  const t = String(f || '').trim(), m = t.match(/^(.*?)[\s-]*(\d+(?:[.,]\d+)?)\s*(GB|TB)\b\s*(.*)$/i);

function cmpServices(c){   // every service the plans include, once each, with the storage sizes on offer

function prepHost(u){ try { return new URL(u).hostname.replace(/^www\./, '').toLowerCase(); } catch (e) { return ''; } }

const prepOfficial = u => prepAllowed(u, PREP_OFFICIAL);

const prepLive = a => !a.until || (String(a.until).includes('T') ? new Date(a.until) > new Date() : a.until >= iso(today()));   // a warning with an end time goes when it ends
const prepDate = d => { const x = pd(String(d || '').slice(0, 10)); return !x ? '' : x.getFullYear() === today().getFullYear() ? dshort(x) : `${dshort(x)} ${x.getFullYear()}`; };
const prepAgreed = () => (PC().agreed || {}).rory === 'yes';
const prepItems = () => S.prep.filter(x => x.status !== 'dropped').sort((a, b) => num(a.stage) - num(b.stage) || num(a.order) - num(b.order) || String(a.name).localeCompare(String(b.name)));
function prepHave(x){   // how much of it we have, 0 to qty (the wishlist "Bought it" counts too)
  const q = Math.max(1, num(x.qty)), w = x.wishId && S.wishlist.find(y => y.id === x.wishId);
  if (w && w.status === 'bought') return q;
  if (x.cat === 'docs' && x.auto === 'plan') return prepPlanDone() ? q : 0;
  return Math.max(0, Math.min(q, num(x.have)));
}
const prepFrac = x => prepHave(x) / Math.max(1, num(x.qty));
function prepStage(n){
  const L = prepItems().filter(x => num(x.stage) === n && x.status !== 'later');
  const done = L.length ? L.reduce((t, x) => t + prepFrac(x), 0) / L.length : 0;
  const left = L.reduce((t, x) => t + num(x.cost) * (1 - prepFrac(x)), 0), cost = L.reduce((t, x) => t + num(x.cost), 0);
  return {n, L, done, pct: Math.round(done * 100), left: Math.round(left * 100) / 100, cost: Math.round(cost * 100) / 100};
}
function prepNow(){   // the stage we're working on: the first one not finished
  const st4 = [1, 2, 3, 4].map(prepStage), cur = st4.find(s => s.done < .999) || st4[3];

}

/* cash at home: part of the emergency fund (rule 8), built in small steps */
function cashHomeAt(di){
  di = di || iso(today()); let v = 0;
  for (const m of S.moves){ if (!pd(m.date) || m.date > di) continue; if (m.to === 'cash') v += num(m.amount); if (m.from === 'cash') v -= num(m.amount); }
  for (const x of S.spending) if (x.paidFrom === 'cash' && pd(x.date) && x.date <= di) v -= num(x.amount);
  return Math.round(v * 100) / 100;
}
function cashPlan(){
  const c = PC().cash, have = cashHomeAt(), tgt = num(c.target) || 200, step = num(c.step) || 50, every = Math.max(1, num(c.every) || 4), t = today();
  const ins = S.moves.filter(m => m.to === 'cash' && pd(m.date)).sort((a, b) => a.date.localeCompare(b.date)), last = ins[ins.length - 1];
  const spent = last && S.spending.some(x => x.paidFrom === 'cash' && x.date >= last.date);
  let next = null;
  if (have < tgt - .005){ next = last ? addDays(pd(last.date), every * 7) : (pd(c.first) || t); if (spent && next > t) next = t; }
  const amt = Math.round(Math.min(step, tgt - have) * 100) / 100, left = have < tgt - .005 ? Math.ceil((tgt - have) / step - 1e-9) : 0;
  const from = c.from === 'joint' ? 'joint' : 'ef', efAcc = efSeries().amount;
  const can = from !== 'ef' || efAcc >= amt - .005;
  return {have, tgt, step, every, amt, next, left, doneBy: next ? addDays(next, Math.max(0, left - 1) * every * 7) : null, agreed: prepAgreed(), from, can, efAcc, due: prepAgreed() && !!next && next <= t, ins};
}

  const r = {act: 0, watch: 1, info: 2}, here = placeNow().code, want = a => (a.country || HOME) === HOME ? true : scope !== 'home' && a.country === here;

const prepWhy = () => PC().why.filter(a => a && a.t && prepAllowed(a.url)).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
const prepSrcName = u => { const h = prepHost(u), m = Object.keys(PREP_MEDIA).find(d => h === d || h.endsWith('.' + d)); return m ? PREP_MEDIA[m] : h; };
const prepSrc = u => { const h = prepHost(u); return h ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(prepSrcName(u))}</a>${prepOfficial(u) ? ' · official' : ''}` : ''; };

/* ---------- a bill paid early (or late) by hand: its money leaves on the day it was really paid ---------- */
function billDays(b, a, z){   // the days a bill's money really leaves between a and z: its due day, or the day it was paid when that was different
  const moved = billHist(b).filter(x => x.due && x.date && x.date !== x.due && pd(x.due) && pd(x.date));
  const ds = occurrences(b, a, z);
  if (!moved.length) return ds.map(d => ({d, due: d}));
  const out = ds.filter(d => !moved.some(x => x.due === iso(d))).map(d => ({d, due: d}));
  for (const x of moved){ const p = pd(x.date), due = pd(x.due); if (p >= a && p <= z && occurrences(b, addDays(due, -1), due).some(o => iso(o) === x.due)) out.push({d: p, due}); }
  return out.sort((p, q) => p.d - q.d);
}

/* ---------- the AIB card, as the bank really has it (8 Nov 2026, asked by Thiago) ----------
   1. Real interest: AIB adds the month's interest on the statement date ("Interest Charged", page 1). It reaches the
      balance overnight, so it counts the day after the statement. Logged as cardlog {type:'interest', stmt, date (stmt + 1),
      amount, base (the card balance it was charged on), days (the cycle)}. A real entry replaces the estimate for its
      statement; later estimates use the rate the real ones show.
   2. The card check: the AIB app's big number only has what's been processed. Purchases still "Pending" (and a payment
      that hasn't reached the card yet) are ticked, so what's saved is what we really owe. */
const cardIntLog = () => S.cardlog.filter(e => e.type === 'interest' && pd(e.stmt)).sort((a, b) => a.stmt.localeCompare(b.stmt));
const cardIntFor = sIso => cardIntLog().find(e => e.stmt === sIso) || null;
function cardRateY(){   // the yearly rate the estimates use: what the last real statement charged, or the APR until there is one
  const apr = num(st().cardApr) / 100, L = cardIntLog().filter(e => num(e.base) > 0 && num(e.days) > 0 && num(e.amount) > 0), e = L[L.length - 1];
  if (!e) return apr;

  return apr > 0 ? Math.min(r, apr * 1.5) : r;
}

  const cc = cardCycles(); if (!cc || cc.estimated) return [];
  const t = today(), start = pd(st().startedOn), from = start ? addDays(start, -35) : addDays(t, -70);
  return cc.list.map((c, i) => ({S: c.S, D: c.D, prev: i ? cc.list[i - 1].S : addDays(c.S, -30)})).filter(c => c.S < t && c.S >= from).reverse();
}
function cardIntTodo(){   // the newest statement, while its interest isn't typed yet (up to 20 days after it)
  const t = today(), c = cardStmtsPast()[0]; if (!c || cardIntFor(iso(c.S))) return null;
  if (dayDiff(c.S, t) < 1 || dayDiff(c.S, t) > 20) return null;
  const b = balanceAt(iso(c.S)), owed = b ? num(b.amount) : (cardState() ? cardState().bal : 0);
  if (!(owed > 0)) return null;
  return {c, est: owed * cardRateY() / 365 * dayDiff(c.prev, c.S)};
}
function cardIntForm(){
  const L = cardStmtsPast(); if (!L.length) return '';
  const f = S.f.ci || (S.f.ci = {});

  if (!f.stmt || !L.some(c => iso(c.S) === f.stmt)) f.stmt = iso((open[0] || L[0]).S);
  const done = cardIntLog().slice().reverse().slice(0, 3);
  return `<div class="formbox"><h3>Interest from the statement</h3><p class="mut" style="font-size:.9rem">AIB adds the month’s interest on the statement date. Type the “Interest Charged” amount from page 1 of the statement (0 if there was none). The real amount replaces the estimate everywhere.</p>
    <div class="form">${field('ci', 'stmt', 'Statement of', {select: L.map(c => [iso(c.S), `${dlong(c.S)}${cardIntFor(iso(c.S)) ? ` · logged ${money(cardIntFor(iso(c.S)).amount)}` : ''}`])})}${field('ci', 'amount', 'Interest charged (€)', {money: true, ph: '19.52'})}</div>
    ${S.err && S.errAt === 'ci' ? `<p class="err">${esc(S.err)}</p>` : ''}
    <div class="actions"><button class="btn strong" data-act="cardInt">Save the interest</button></div>
    ${done.length ? `<div class="kv">${done.map(e => `<span>${dshort(pd(e.stmt))} statement</span><span>${money(e.amount)}</span>`).join('')}</div>` : ''}
    ${cardRateFromStmt() ? `<p class="mut" style="font-size:.85rem">Estimates for the next statements use what the last one really charged: about ${(cardRateY() * 100).toFixed(1)}% a year on the balance.</p>` : ''}</div>`;
}
async function cardIntSave(){
  const f = S.f.ci || {}; S.errAt = 'ci';

function cardIntHealth(add){
  const L = S.cardlog.filter(e => e.type === 'interest'), seen = {};

/* the card check: what the app shows, plus what's still pending */
function cardPendItems(form){

/* the card's interest, month by month (8 Nov 2026, asked by Thiago): one bar per statement, the real amount from the statement, the next one estimated */
function cardIntMonths(){
  const cc = cardCycles(); if (!cc || cc.estimated) return null;
  const t = today(), cs = cardState(), seen = {}, past = [];   // the statements already out since the system started, and every statement whose interest was typed (older ones included)
  for (const c of cardStmtsPast()) { seen[iso(c.S)] = 1; past.push(c.S); }
  for (const e of cardIntLog()) if (!seen[e.stmt] && pd(e.stmt) < t){ seen[e.stmt] = 1; past.push(pd(e.stmt)); }
  const list = past.sort((a, b) => a - b).slice(-6).map(S0 => { const e = cardIntFor(iso(S0)); return {S: S0, v: e ? num(e.amount) : null, real: !!e}; });
  const nx = cc.list.find(c => c.S >= t), i = nx ? cc.list.indexOf(nx) : -1;
  if (nx && cs && cs.bal > 0) list.push({S: nx.S, v: cs.bal * cardRateY() / 365 * (i > 0 ? dayDiff(cc.list[i - 1].S, nx.S) : 30), est: true});
  return list;
}

    ${list.map((m, k) => { const cx = L + slot * k + slot / 2, lab = `<text x="${cx.toFixed(1)}" y="${H - 8}" text-anchor="middle" font-size="11.5" fill="${C.muted}" font-family="IBM Plex Mono, monospace">${esc(mo(m.S))}${m.est ? '*' : ''}</text>`;

  </svg>`;

function cardIntPanel(){

/* ---------- system health: the page checks itself every time it opens; Claude runs the full check every Monday ---------- */
const APP_VERSION = '2026.11.08-8';
function selfCheck(){   // cheap checks on the data, run on every open: things that don't fit, and the weekly tasks that should have run
  const key = `${S._rt}|${iso(today())}`; if (S._hc && S._hc.k === key) return S._hc.v;
  const items = [], t = today(), add = (st2, area, txt) => items.push({st: st2, area, t: txt});
  const okNum = v => typeof v === 'number' ? isFinite(v) : has(v) && isFinite(Number(v));
  const dOK = v => !!pd(v);
  try {
    cardIntHealth(add);
    // bills
    for (const b of S.bills){
      const nm = b.name || 'A bill';
      if (!FREQ[b.freq || 'monthly']) add('bad', 'Bills', `${nm}: unknown frequency “${b.freq}”.`);
      if (b.active === false) continue;
      const f = b.freq || 'monthly';
      if (f === 'monthly' && !(num(b.dueDay) >= 1 && num(b.dueDay) <= 31)) add('bad', 'Bills', `${nm}: no due day.`);
      if (['bimonthly', 'quarterly', 'annual', 'ndays'].includes(f) && !dOK(b.anchor)) add('bad', 'Bills', `${nm}: no date for the next payment.`);
      if (f === 'instal' && !instCycles(b).length) add('bad', 'Bills', `${nm}: a payment plan with no period.`);
      if (f !== 'instal' && b.id !== 'electricity' && !(num(b.amount) > 0)) add('warn', 'Bills', `${nm}: the amount is €0.`);
      const days = (b.history || []).map(h => h.date).filter(Boolean), dup = days.filter((d, i) => days.indexOf(d) !== i);
      if (dup.length) add('warn', 'Bills', `${nm}: paid twice on ${dshort(pd(dup[0]))} in its history.`);
      if (b.vault && has(b.saved) && num(b.amount) > 0 && num(b.saved) > num(b.amount) * 1.05 + 1) add('warn', 'Vault', `${nm}: the Vault holds ${money(b.saved)} for a ${money(b.amount)} bill.`);
    }
    // purchases
    const accOK = ['joint', 'card', 'bills', 'thiago', 'rory'];
    for (const x of S.spending){
      const nm = x.what || 'A purchase';
      if (!dOK(x.date) || !(num(x.amount) > 0)) add('bad', 'Purchases', `${nm}: missing date or amount.`);
      else if (!accOK.includes(x.paidFrom)) add('bad', 'Purchases', `${nm} (${dshort(pd(x.date))}): unknown account “${x.paidFrom}”.`);
      if (x.sched && !S.cardlog.some(e => e.id === x.sched)) add('warn', 'Purchases', `${nm}: its card charge is gone.`);
    }

    if (nx && pd(nx.from) && inc > 0 && inc < num(nx.v) - .005 && dayDiff(t, pd(nx.from)) <= 21 && dayDiff(pd(nx.from), t) <= 35) add('idle', `Social welfare goes up from ${dlong(pd(nx.from))} (Illness Benefit maximum ${money(ib.v).replace('.00', '')} → ${money(nx.v).replace('.00', '')} a week). When ${nm}’s first new payment lands, change the income in Settings so every transfer follows.`, 'setup', 'Open Settings');
    const cb = fact('christmasBonus'), w = pd(cb.week); if (w && inc > 0 && dayDiff(t, w) <= 21 && dayDiff(w, t) <= 7) add('idle', `Christmas Bonus, week of ${dshort(w)}: Illness Benefit gets it only after 12 months on the payment. If it arrives, log it in Transfers (${nm} → Joint, an extra move) and decide together where it goes.`, 'transfers', 'Transfers'); }
  if (dayDiff(pd(factsCheckedOn()), t) > 9) add('idle', `Irish rules and rates were last checked on ${dshort(pd(factsCheckedOn()))}. The weekly check may have missed a week: see Settings → Rules.`, 'rules', 'See them');
  for (const e of S.cardlog.filter(e => e.type === 'scheduled' && !S.spending.some(x => x.sched === e.id))) out.push({st: 'bad', txt: `${e.note || 'A card charge'} (${money(e.amount)}, on the card ${dshort(pd(e.date))}) isn’t logged as a purchase yet, so Rory’s report doesn’t show it. Say who it’s for, need or want, and whether Rory knew.`, act: 'schLog', id: e.id, btn: 'Log it'});
  const lastChk = sortedChecks().pop();

    if (AD && !AD.hasBudgets) add(AD.learned && AD.learned.none ? 'warn' : 'idle', AD.learned && AD.learned.none ? `No shop, cigarettes or drinks logged in ${AD.learned.weeks} weeks, so nothing in the Joint account counts as free and nothing goes to the plan on Sunday. Log them each time (Today → Log a purchase; “Split a receipt” for a mixed one), under Groceries, Cigarettes or Drinks.` : `Log the shop, cigarettes and drinks each time you buy them${AD.learned && AD.learned.from ? `: from ${dshort(addDays(AD.learned.from, 14))} the system knows what they really cost each week` : ''}.`, '', '');
    const okW = AD ? wishItems().filter(w => wishVerdict(w, AD).st === 'ok') : []; if (okW.length) add('idle', `Wishlist: ${okW.map(w => `${w.what} (${money(w.price)})`).join(', ')} ${okW.length > 1 ? 'are' : 'is'} OK to buy now, with Rory.`, 'advisor', 'See');
    const told = wishItems().filter(w => w.told !== 'yes'); if (told.length) add('idle', `Tell Rory about ${told.map(w => w.what).join(', ')} on the wishlist: until then the answer is wait.`, 'advisor', 'Open'); }
  if (fl.configured){ const m = planMoves(planState()).find(x => (x.st === 'bad' || x.st === 'warn') && !/money check|left the accounts|isn’t logged|more than expected|Bills Pocket review|tested day by day/.test(x.t)); if (m) add(m.st, m.t.replace(/<[^>]+>/g, ''), 'plan', 'Open the plan'); }

}

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load ' + src)); document.head.appendChild(s); }); }
async function makePdf(){
  const dl = await S.dlP;
  if (!dl){ toast('Saving files isn’t available in this view.'); return; }
  const ws = S.reportWeek ? pd(S.reportWeek) : weekStartOf(today());
  S.busy = true; render();
  const lookWas = document.documentElement.dataset.look; document.documentElement.dataset.look = 'classic';   // Rory's PDF keeps its own look
  const stage = $('#pdfStage');
  try {
    if (!window.html2canvas) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    if (!window.jspdf) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const D = reportData(ws);
    stage.innerHTML = `<div class="paper fit">${reportBoard(ws, true, D)}</div><div class="paper fit">${reportDetails(ws, true, D)}</div>`;
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const pdf = new window.jspdf.jsPDF({unit: 'mm', format: 'a4'});
    const pw = 210, ph = 297, SCALE = 2;
    let p = 0;
    const nodes = Array.from(stage.children);
    for (let ni = 0; ni < nodes.length; ni++){
      const node = nodes[ni];
      // safe places to cut: the bottom edge of every section, so no panel is sliced in half
      const top0 = node.getBoundingClientRect().top;
      const cuts = Array.from(node.querySelectorAll('.rep > *, .rep > .two > *, .glance > *, .glance > .gcols > *')).map(el => Math.round((el.getBoundingClientRect().bottom - top0 + 6) * SCALE)).sort((a, b) => a - b);
      const canvas = await window.html2canvas(node, {scale: SCALE, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: 900});
      const pageH = Math.floor(canvas.width * ph / pw);
      const addSlice = (y, h, fitWhole) => {
        const c = document.createElement('canvas'); c.width = canvas.width; c.height = h;
        const g = c.getContext('2d'); g.fillStyle = '#ffffff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
        if (p++) pdf.addPage();
        const img = c.toDataURL('image/jpeg', 0.86);
        if (fitWhole){ const hh = Math.min(ph, h * pw / canvas.width), ww = hh === ph ? canvas.width * ph / h : pw; pdf.addImage(img, 'JPEG', (pw - ww) / 2, 0, ww, hh); }
        else pdf.addImage(img, 'JPEG', 0, 0, pw, h * pw / canvas.width);
      };
      if (node.classList.contains('fit')){ addSlice(0, canvas.height, true); continue; }   // pages 1 and 2 always fit on one sheet each
      let y = 0;
      while (y < canvas.height - 4){
        let end = Math.min(canvas.height, y + pageH);
        if (end < canvas.height){ const best = cuts.filter(cu => cu > y + pageH * 0.35 && cu <= y + pageH).pop(); if (best) end = best; }
        addSlice(y, end - y, false); y = end;
      }
    }
    const blob = pdf.output('blob');
    stage.innerHTML = ''; document.documentElement.dataset.look = lookWas;
    S.busy = false; render();
    try { await dl.save({filename: `Week by Week ${iso(ws)}.pdf`, data: blob}); toast('PDF saved'); }
    catch (e) { if (e && e.code !== 'declined') toast(e.code === 'rate_limited' ? 'A save is already waiting. Try again in a moment.' : 'The PDF couldn’t be saved here.'); }
  } catch (e) {
    console.warn(e); stage.innerHTML = ''; document.documentElement.dataset.look = lookWas; S.busy = false; render(); toast('The PDF couldn’t be made. Try again.');
  }
}
