    case 'checkClear': S.f.check = {what: '', price: '', paidFrom: 'joint', who: '', need: '', told: ''}; render(); break;
    case 'checkLog': { const c = S.f.check; await spendSave({date: iso(today()), what: c.what || 'Purchase', amount: c.price, cat: '', paidFrom: c.paidFrom, who: c.who, kind: c.need === 'yes' ? 'need' : 'planned', told: 'before', note: ''}); S.f.check = {what: '', price: '', paidFrom: 'joint', who: '', need: '', told: ''}; render(); break; }
    case 'wishAdd': { if (!needDb()) break; const c = S.f.check; try { await wishPut({what: String(c.what || 'Item').trim(), price: Math.round(num(c.price) * 100) / 100, who: c.who || '', kind: c.need === 'yes' ? 'need' : 'want', told: c.told === 'yes' ? 'yes' : 'no', prio: '2', addedAt: new Date().toISOString(), status: 'waiting'}); S.f.check = {what: '', price: '', paidFrom: 'joint', who: '', need: '', told: ''}; toast('On the wishlist. Decide later.'); render(); } catch (er) { writeErr(er); } break; }
    case 'wishSave': { const f = S.f.wish || {}, price = Math.round(num(f.price) * 100) / 100; S.errAt = 'wish';
      if (!String(f.what || '').trim()) { S.err = 'Say what it is.'; render(); break; }
      if (!(price > 0)) { S.err = 'Enter the price.'; render(); break; }
      if (!WHO[f.who]) { S.err = 'Choose who it’s for.'; render(); break; }
      if (!['need', 'want'].includes(f.kind)) { S.err = 'Need or want?'; render(); break; }
      if (!(f.kind === 'want' && price > (num(st().ruleThreshold) || 20)) && !['yes', 'no'].includes(f.told)) { S.err = 'Does Rory know?'; render(); break; }
      if (!needDb()) break; S.err = '';
      try { const doc = {what: String(f.what).trim(), price, who: f.who, kind: f.kind, prio: WPRIO[f.prio] ? f.prio : '2', told: f.told === 'yes' ? 'yes' : 'no', by: pd(f.by) ? f.by : '', note: String(f.note || '').trim(), addedAt: new Date().toISOString(), status: 'waiting'};
        await wishPut(doc, `${WHO[doc.who]}, ${doc.kind}, ${WPRIO[doc.prio].toLowerCase()}`);
        S.f.wish = {}; S.wishOpen = false; toast('On the wishlist'); render(); } catch (er) { writeErr(er); } break; }
    case 'wishTold': { if (!needDb()) break; const w = S.wishlist.find(y => y.id === b.dataset.id); if (!w) break; try { await S.db.doc('wishlist/' + w.id).update({told: 'yes'}); await logChange('wishlist', `Rory knows about ${w.what} (${money(w.price)})`); toast('Saved'); } catch (er) { writeErr(er); } break; }
    case 'wishBought': { if (!needDb()) break; const w = S.wishlist.find(y => y.id === b.dataset.id); if (!w) break;
      await spendSave({date: iso(today()), what: w.what, amount: String(w.price), cat: w.cat || autoCat(w.what) || 'Other', paidFrom: 'joint', who: w.who || 'both', kind: w.kind === 'need' ? 'need' : 'planned', told: 'before', note: 'From the wishlist'});
      if (!S.err){ try { await S.db.doc('wishlist/' + w.id).update({status: 'bought', decidedAt: new Date().toISOString()}); } catch (er) { writeErr(er); } } break; }
    case 'wishDrop': { if (!needDb()) break; const w = S.wishlist.find(y => y.id === b.dataset.id); try { await S.db.doc('wishlist/' + b.dataset.id).update({status: 'dropped', decidedAt: new Date().toISOString()}); if (w) await logChange('wishlist', `Said no to ${w.what} (${money(w.price)})`); toast('Dropped. Money kept.'); } catch (er) { writeErr(er); } break; }
    case 'wkPrev': { const ws = S.reportWeek ? pd(S.reportWeek) : weekStartOf(today()); S.reportWeek = iso(addDays(ws, -7)); render(); break; }
    case 'wkNext': { const ws = S.reportWeek ? pd(S.reportWeek) : weekStartOf(today()); const n = addDays(ws, 7); S.reportWeek = n > weekStartOf(today()) ? null : iso(n); render(); break; }
    case 'wkNow': S.reportWeek = null; render(); break;
    case 'wkNote': { const ws = S.reportWeek || iso(weekStartOf(today())); const v = S.f.note[ws]; if (v == null) { toast('Nothing changed'); break; } await weekUpdate(ws, {note: String(v)}); delete S.f.note[ws]; toast('Note saved'); break; }
    case 'pdf': if (!S.busy) makePdf(); break;
    case 'decSave': { if (!needDb()) break; const t = String(S.f.dec.text || '').trim(); if (!t) { toast('Write the decision first.'); break; } await logChange('decision', t); S.f.dec.text = ''; toast('Saved to history'); render(); break; }
    case 'gapLog': case 'gapNote': case 'gapUnk': await gapAction(a, b); break;
    case 'unkSave': unkSave(); break;
    case 'amtSave': { if (!needDb()) break; const wsI = b.dataset.w;
      { const kA = `${wsI}.aib`; if (S.f.amt && kA in S.f.amt){   // a different amount to AIB savings is a different card payment
          const raw = String(S.f.amt[kA]).trim(), p0 = weekCardPay(wsI); delete S.f.amt[kA];
          if (raw){ await cardWkSave(wsI, raw); S.cardAmtDone = true; } else if (p0 && Math.abs(num(p0.amount) - num(st().cardWeekly)) >= .005 && num(st().cardWeekly) > 0){ await cardWkSave(wsI, num(st().cardWeekly)); S.cardAmtDone = true; } } }
      const cur = S.weeks[wsI] || {}, am = {...(cur.amounts || {})}, tr = {...(cur.transfers || {})}, logs = [];
      for (const x of transferSteps().filter(y => y.amount != null && y.id !== 'aib')){
        const key = `${wsI}.${x.id}`; if (!(S.f.amt && key in S.f.amt)) continue;
        const raw = String(S.f.amt[key]).trim(), old = am[x.id];
        if (!raw){ if (old){ delete am[x.id]; logs.push(`${x.to}: back to the planned ${money(old.p)}`); } continue; }
        const a = Math.round(num(raw) * 100) / 100, p = old ? num(old.p) : Math.round(x.amount * 100) / 100;
        if (old && Math.abs(num(old.a) - a) < .005) continue;
        am[x.id] = {a, p, n: x.id === 'rory' ? 'Rory → Joint' : x.id === 'thiago' ? 'Thiago → Joint' : x.to}; tr[x.id] = true;
        logs.push(`${am[x.id].n}: ${money(a)} sent instead of the planned ${money(p)} (${a >= p ? '+' : '−'}${money(Math.abs(a - p))})`);
      }
      if (!logs.length){ if (!S.cardAmtDone) toast('Nothing changed'); S.cardAmtDone = false; break; }
      S.cardAmtDone = false;
      const body = {...cur, amounts: am, transfers: tr, updatedAt: new Date().toISOString()}; delete body.id; stampTicks(cur, body);
      try { await weekSet(wsI, body); for (const l of logs) await logChange('transfer', `Week of ${weekLabel(pd(wsI))}: ${l}`); for (const k of Object.keys(S.f.amt || {})) if (k.startsWith(wsI + '.')) delete S.f.amt[k]; toast('Real amounts saved'); render(); } catch (er) { writeErr(er); }
      break; }
    case 'payEarly': await payEarly(); await enSync(); break;
    case 'payOpen': S.payOpen = S.payOpen === b.dataset.k ? null : b.dataset.k; S.err = ''; render(); break;
    case 'ppSave': await ppSave(b.dataset.k); await enSync(); break;
    case 'stepDone': await stepSave(b.dataset.w, b.dataset.id, true); break;
    case 'stepAmt': await stepSave(b.dataset.w, b.dataset.id, false); break;
    case 'tickKey': await tickKey(b.dataset.w, b.dataset.id, b.dataset.v === '1'); break;
    case 'ppQuick': await ppSave(b.dataset.k, true); break;
    case 'ppUndo': await ppUndo(b.dataset.id, b.dataset.at); await enSync(); break;
    case 'schLog': { const e = S.cardlog.find(y => y.id === b.dataset.id); if (!e) break; S.f.spend = {date: String(e.at || '').slice(0, 10) || iso(today()), what: e.note || '', amount: String(e.amount), cat: '', paidFrom: 'card', who: '', kind: '', told: '', note: '', sched: e.id}; S.tab = 'today'; S.todayOpen = 'log'; S.err = ''; render(); document.getElementById('f_spend_what')?.scrollIntoView({block: 'center'}); break; }
    case 'schCancel': S.f.spend = {date: iso(today()), what: '', amount: '', cat: '', paidFrom: 'joint', who: '', kind: 'need', told: 'before', note: ''}; S.todayOpen = ''; S.err = ''; render(); break;
    case 'payLog': S.tab = 'today'; S.todayOpen = 'log'; S.err = ''; render(); document.getElementById('f_spend_what')?.scrollIntoView({block: 'center'}); break;
    case 'cardWk': await cardWkSave(b.dataset.w, b.dataset.v); break;
    case 'cardWkDel': await cardWkDel(b.dataset.w); break;
    case 'vbLog': await varLog(b.dataset.id); await enSync(); break;
    case 'enRead': await enReadAct(); break;
    case 'enBill': await enBillAct(); break;
    case 'enTariff': await enTariffAct(); break;
    case 'enLink': await enLink(); break;
    case 'enDelRead': await enDelRead(b.dataset.d); break;
    case 'enBillDel': await enBillDel(b.dataset.d); break;
    case 'vbDel': await varDel(b.dataset.id, b.dataset.d); await enSync(); break;
    case 'prApply': await prApply(); break;
    case 'backup': await backupDownload(); break;
    case 'wiseToBill': wiseToBill(b.dataset.id); break;
    case 'prRaise': await prRaise(); break;
    case 'prepBuy': case 'prepHave': case 'prepUndo': case 'prepBuySave': case 'prepWish': case 'prepDrop': case 'prepMedAdd': case 'prepMedDays': case 'prepMedDaysSave': case 'prepPlanSave': case 'prepAgree': case 'prepCash': case 'prepCompare': await prepAction(a, b); break;
    case 'cmpNew': cmpNewForm(); render(); document.getElementById('cmpPanel')?.scrollIntoView({block: 'start'}); break;
    case 'cmpFromCheck': { const c = S.f.check || {}; cmpNewForm({name: c.what, price: c.price}); S.todayOpen = ''; S.tab = 'plan'; S.sub.plan = 'compare'; render(); window.scrollTo({top: 0}); break; }
    case 'cmpOpen': { const x = S.compare.find(y => y.id === b.dataset.id); if (!x) break; cmpFormFrom(x); render(); document.getElementById('cmpPanel')?.scrollIntoView({block: 'start'}); break; }
    case 'cmpClose': S.f.cmp = null; S.err = ''; S.confirmCmp = null; render(); break;
    case 'cmpPlanAdd': { const f = S.f.cmp; if (!f) break; const k = cmpKey(); S.f['cp_' + k] = {name: '', price: '', per: 'month', covers: f.users || '1', feats: ''}; f.plans.push(k); render(); break; }
    case 'cmpPlanDel': { const f = S.f.cmp; if (!f) break; f.plans = f.plans.filter(k => k !== b.dataset.k); render(); break; }
    case 'cmpRm': { const f = S.f.cmp; if (!f) break; f.rm ||= {}; f.rm[b.dataset.id] = !f.rm[b.dataset.id]; render(); break; }
    case 'cmpSave': await cmpSave(); break;
    case 'cmpDel': await cmpDel(b.dataset.id); break;
    case 'cmpTrialBill': await cmpTrialBill(b.dataset.id); break;
    case 'cmpUse': { const f = S.f.cmp; if (!f) break; f.use ||= {}; f.use[b.dataset.k] = b.dataset.v; render(); break; }
    case 'cmpAsk': await cmpAsk(b.dataset.k); break;
    case 'roryAnswer': await roryAnswer(b.dataset.k, b.dataset.id, b.dataset.v); break;
    case 'wishAskAgain': { if (!needDb()) break; const w = S.wishlist.find(y => y.id === b.dataset.id); if (!w || !wishAskAgainOk(w)) break; const at = new Date().toISOString();
      try { await S.db.doc('wishlist/' + w.id).update({asked: at}); await logChange('decision', `Asked Rory again (wishlist): ${w.what} ${money(w.price)}`, {wish: w.id, step: 'ask', short: `Thiago asks again: ${w.what}, ${money(w.price)}`}); toast('Rory sees it at the top of his report'); } catch (er) { writeErr(er); } break; }
    case 'enSwitchCancel': await enSwitchCancel(); break;
    case 'cmpApply': await cmpApply(b.dataset.k); break;
    case 'cmpUndo': await cmpUndo(b.dataset.id); break;
    case 'cmpTrialCancel': await cmpTrialCancel(b.dataset.id); break;
    case 'prMove': await prMove(); break;
    case 'asSave': asSave(); break;
    case 'asDel': { if (!needDb()) break; const x = S.assets.find(y => y.id === b.dataset.id); if (!x) break; if (S.confirmAs !== x.id){ S.confirmAs = x.id; toast('Click Delete again to remove it.'); break; } S.confirmAs = null; try { await S.db.doc('assets/' + x.id).delete(); await logChange('balance', `Removed ${x.name} (${money(x.value)}) from the balance`); toast('Removed'); } catch (er) { writeErr(er); } break; }
    case 'planSave': planSave(); break;
    case 'planCancel': S.f.plan = null; S.err = ''; render(); break;
    case 'planTog': case 'planRule': case 'planInvest': case 'planExtra': case 'planEfToCard': case 'planCardToEf': await planAction(a, b); break;
    case 'setSave': setSave(); break;
    case 'ntfOn': ntfDo(n => n.on(S.canWrite ? 'Thiago’s phone' : 'Rory’s phone'), st => { S.ntf.state = st; return st === 'on' ? 'Notifications on for this phone' : ''; }); break;
    case 'ntfOff': ntfDo(n => n.off(), st => { S.ntf.state = st; return 'Off for this phone'; }); break;
    case 'ntfTest': ntfDo(n => n.test(), k => k ? 'Sent: it arrives in a few seconds' : 'Turn notifications on for this phone first'); break;
    case 'ntfSave': ntfSave(); break;
    case 'setCancel': S.f.set = null; S.err = ''; render(); break;
  }
});

/* ---------- boot ---------- */
const useCap = n => (window.claude && typeof window.claude.use === 'function') ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
window.addEventListener('scroll', iosScroll, {passive: true});
render();
(async () => {
  S.dlP = useCap('downloads');
  S.sampleP = useCap('sample');
  const db = await useCap('db');
  if (!db){ S.noDb = true; render(); return; }
  S.db = db;
  useCap('user').then(async u => { if (!u) return; try { const c = await u.can('data.write'); if (c === false){ S.canWrite = false; render(); } } catch (e) {} try { if (!S.canWrite && await u.can('answer.own') === true){ S.canAnswer = true; render(); } } catch (e) {} });   // Rory's own account can answer Thiago's questions, nothing else
  useCap('notify').then(n => { if (n) ntfLoad(n); });   // only in our own app: notifications on this phone
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.ntf) S.ntf.api.state().then(st => { if (S.ntf && st !== S.ntf.state){ S.ntf.state = st; render(); } }).catch(() => {}); });   // back from the iPhone's Settings
  const onErr = e => { console.warn(e); if (e && e.code === 'revoked'){ S.noDb = true; render(); } };
  db.doc('config/settings').onSnapshot(s => { S.settings = s.exists ? {...s.data()} : {}; S.got.settings = true; sched(); }, onErr);
  db.doc('config/plan').onSnapshot(s => { S.plan = s.exists ? {...s.data()} : {}; S.got.plan = true; sched(); }, onErr);
  db.doc('config/facts').onSnapshot(s => { S.facts = s.exists ? {...s.data()} : {}; S.got.facts = true; sched(); }, onErr);
  db.doc('config/energy').onSnapshot(s => { S.energy = s.exists ? {...s.data()} : {}; S.got.energy = true; sched(); }, onErr);
  db.doc('config/prep').onSnapshot(s => { S.prepCfg = s.exists ? {...s.data()} : {}; S.got.prepCfg = true; sched(); }, onErr);
  db.doc('config/advice').onSnapshot(s => { S.advice = s.exists ? {...s.data()} : {}; S.got.advice = true; sched(); }, onErr);
  db.doc('config/health').onSnapshot(s => { S.health = s.exists ? {...s.data()} : {}; S.got.health = true; sched(); }, onErr);
  for (const name of DATA_COLLS){
    db.collection(name).onSnapshot(q => {
      const arr = q.docs.map(d => ({id: d.id, ...d.data()}));
      if (name === 'weeks'){ S.weeks = {}; arr.forEach(w => { S.weeks[w.id] = w; }); } else S[name] = arr;
      S.got[name] = true; sched();
    }, onErr);
  }
  let wasNarrow = window.innerWidth < 600; window.addEventListener('resize', () => { const n = window.innerWidth < 600; if (n !== wasNarrow){ wasNarrow = n; sched(); } });
  setInterval(() => { if (S.tab === 'today' && !document.activeElement?.matches('input,textarea,select')) sched(); }, 60000);
})();
</script>
